<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Game Portal</title>
  
  <!-- Enables SharedArrayBuffer on GitHub Pages for WebAssembly games -->
  <script src="coi-serviceworker.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d12;
      color: #f1f1f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #232332;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .nav-links a {
      color: #9ea4b8;
      text-decoration: none;
      margin-left: 16px;
      font-size: 0.95rem;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .game-wrapper {
      width: 100%;
      max-width: 800px;
      background: #161621;
      border: 1px solid #2a2a3c;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    /* 4:3 aspect ratio container for GameMaker / Deltarune */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
    }

    .viewport iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1c1c29;
      border-top: 1px solid #2a2a3c;
    }

    .game-title {
      font-weight: 600;
      font-size: 1rem;
    }

    button.fullscreen-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.fullscreen-btn:hover {
      background: #4338ca;
    }

    .instructions {
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
      background: #161621;
      border: 1px solid #2a2a3c;
      border-radius: 10px;
      padding: 16px 20px;
      line-height: 1.6;
      color: #c7cbda;
      font-size: 0.95rem;
    }

    .instructions h2 {
      color: #fff;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .instructions ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Game Site</h1>
    <nav class="nav-links">
      <a href="#controls">Controls</a>
      <a href="https://github.com" target="_blank">GitHub</a>
    </nav>
  </header>

  <main class="game-wrapper">
    <div class="viewport" id="game-container">
      <!-- Point src to your self-hosted runner or GameMaker export folder -->
      <iframe id="game-frame" src="./game/index.html" allowfullscreen></iframe>
    </div>
    <div class="toolbar">
      <span class="game-title">Web Runner</span>
      <button class="fullscreen-btn" onclick="goFullscreen()">Fullscreen</button>
    </div>
  </main>

  <section class="instructions" id="controls">
    <h2>How to Play & Controls</h2>
    <ul>
      <li><strong>Click inside the game screen</strong> once to enable audio and keyboard input.</li>
      <li><strong>Move:</strong> Arrow Keys</li>
      <li><strong>Confirm / Interact:</strong> Z or Enter</li>
      <li><strong>Cancel / Run:</strong> X or Shift</li>
      <li><strong>Menu:</strong> C or Ctrl</li>
    </ul>
  </section>

  <script>
    function goFullscreen() {
      const container = document.getElementById("game-container");
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    }
  </script>

</body>
</html>
